<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORTEX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060612;color:#fff;font-family:Arial;overflow-x:hidden}
/* YOUR EYE VORTEX FROM SCREENSHOT */
.eye-bg{position:fixed;inset:0;z-index:-2;background:#060612;display:flex;align-items:center;justify-content:center}
.eye{width:85vw;height:85vw;max-width:520px;max-height:520px;border-radius:50%;background:radial-gradient(circle, #050510 0%, #050510 35%, #00d4ff 38%, #00a3cc 55%, #4a2080 70%, #1a0a40 85%, #060612 100%);box-shadow:0 0 80px #00d4ff,0 0 140px #7c3aed, inset 0 0 60px #00d4ff;animation:pulse 3s infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 80px #00d4ff,0 0 140px #7c3aed}50%{transform:scale(1.05);box-shadow:0 0 120px #00d4ff,0 0 200px #7c3aed}}
.page{display:none;min-height:100vh;padding-bottom:100px}
.page.active{display:block}
.top{position:sticky;top:0;z-index:20;background:rgba(6,6,18,.92);backdrop-filter:blur(20px);display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(0,212,255,.2)}
.logo{font-weight:900;font-size:22px;color:#00d4ff;text-shadow:0 0 10px #00d4ff}
.btn{width:40px;height:40px;border-radius:50%;background:rgba(0,212,255,.15);border:1px solid rgba(0,212,255,.3);color:#fff;display:flex;align-items:center;justify-content:center}
.srow{display:flex;gap:10px;overflow-x:auto;padding:10px 12px}
.s{width:110px;min-width:110px;height:180px;border-radius:16px;overflow:hidden;position:relative;background:#111;border:1px solid rgba(0,212,255,.3)}
.s img{width:100%;height:100%;object-fit:cover}
.s-plus{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:32px;height:32px;background:#00d4ff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;border:2px solid #060612}
.slab{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.8);padding:6px;text-align:center;font-size:11px}
.post{background:rgba(10,10,28,.9);margin:8px 0;padding:10px 12px;border:1px solid rgba(0,212,255,.15);border-radius:12px;margin-left:8px;margin-right:8px}
.post-h{display:flex;gap:10px;align-items:center}
.post-h img{width:38px;height:38px;border-radius:50%;border:1px solid #00d4ff}
.pimg{width:100%;border-radius:12px;margin-top:8px;max-height:380px;object-fit:cover}
.act{display:flex;justify-content:space-around;border-top:1px solid rgba(255,255,255,.1);margin-top:8px;padding-top:6px}
.act button{background:0;border:0;color:#aaa;font-size:13px;padding:6px}
.drawer{position:fixed;top:0;left:-100%;width:84%;height:100%;background:#0a0a1e;z-index:100;transition:.3s;padding:14px;border-right:1px solid rgba(0,212,255,.3)}
.drawer.open{left:0}
.mitem{padding:12px;background:rgba(0,212,255,.08);border-radius:12px;margin:6px 0;border:1px solid rgba(0,212,255,.1)}
.nav{position:fixed;bottom:10px;left:10px;right:10px;background:rgba(6,6,18,.96);backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:8px 0;border-radius:22px;border:1px solid rgba(0,212,255,.25);z-index:50}
.nav button{background:0;border:0;color:#fff;opacity:.6;padding:6px 16px;border-radius:14px;display:flex;flex-direction:column;align-items:center}
.nav button.active{opacity:1;background:rgba(0,212,255,.2);color:#00d4ff;box-shadow:0 0 15px rgba(0,212,255,.4)}
.nav span{font-size:24px}
.hidden{display:none}
</style>
</head>
<body>
<div class="eye-bg"><div class="eye"></div></div>
<input type="file" id="fStory" accept="image/*" class="hidden">
<input type="file" id="fPost" accept="image/*" class="hidden">

<div class="drawer" id="drawer">
<div style="display:flex;justify-content:space-between"><b style="color:#00d4ff">☰ VORTEX Menu</b><button class="btn" onclick="closeD()">✕</button></div>
<div class="mitem" onclick="tab('home',0)">🏠 Home</div>
<div class="mitem" onclick="tab('friends',1)">👥 Friends</div>
<div class="mitem" onclick="tab('video',2)">🎬 Reels</div>
<div class="mitem" onclick="tab('market',3)">🏪 Marketplace</div>
<div class="mitem" onclick="alert('Settings: Theme Eye Blue saved! Dark mode ON')">⚙️ Settings & Privacy - Eye Vortex Theme</div>
<div class="mitem" style="color:#ff6b6b" onclick="localStorage.clear();location.reload()">🚪 Clear Data / Logout</div>
<div class="mitem" style="opacity:.6;font-size:11px">Backend file can't run on GitHub Pages. Use frontend only for now. For backend host on Render.com</div>
</div>

<div id="home" class="page active">
<div class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn" onclick="openD()">☰</button><div class="logo">VORTEX</div></div><div style="display:flex;gap:8px"><button class="btn" onclick="alert('Search LIVE - filter feed')">🔍</button><button class="btn" onclick="tab('friends',1)">💬</button></div></div>
<div style="margin:10px 12px;background:rgba(255,255,255,.08);border-radius:22px;padding:10px 14px;display:flex;gap:10px;align-items:center;border:1px solid rgba(0,212,255,.15)"><img src="https://i.pravatar.cc/100?img=32" style="width:34px;height:34px;border-radius:50%"><input style="flex:1;background:0;border:0;color:#fff;outline:0" placeholder="What's on your mind, Brilliant?" onclick="createPost()"><button class="btn" style="width:32px;height:32px;background:#00d4ff;color:#000" onclick="document.getElementById('fPost').click()">📷</button></div>
<div class="srow" id="storyRow"></div>
<div id="feed"></div>
</div>

<div id="friends" class="page"><div class="top"><button class="btn" onclick="openD()">☰</button><b>Friends</b><button class="btn">🔍</button></div><div id="friendsList" style="padding:10px"></div></div>
<div id="video" class="page"><div class="top"><button class="btn" onclick="openD()">☰</button><b>Video</b><button class="btn" onclick="document.getElementById('fPost').click()">＋</button></div><div id="videoFeed"></div></div>
<div id="market" class="page"><div class="top"><button class="btn" onclick="openD()">☰</button><b>Marketplace</b></div><div id="marketGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px"></div></div>

<div class="nav">
<button class="active" id="b0" onclick="tab('home',0)"><span>🏠</span><small>Home</small></button>
<button id="b1" onclick="tab('friends',1)"><span>👥</span><small>Friends</small></button>
<button id="b2" onclick="tab('video',2)"><span>🎬</span><small>Video</small></button>
<button id="b3" onclick="tab('market',3)"><span>🏪</span><small>Market</small></button>
<button id="b4" onclick="openD()"><span>☰</span><small>Menu</small></button>
</div>

<script>
function openD(){document.getElementById('drawer').classList.add('open')}
function closeD(){document.getElementById('drawer').classList.remove('open')}
function tab(id,i){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(i!=null)document.getElementById('b'+i).classList.add('active');closeD();window.scrollTo(0,0)}
let stories=JSON.parse(localStorage.getItem('vx_s')||'[]');
let posts=JSON.parse(localStorage.getItem('vx_p')||'[]');
function renderStories(){let r=document.getElementById('storyRow');r.innerHTML=`<div class=s onclick="document.getElementById('fStory').click()"><img src=https://picsum.photos/200/300?1><div class=s-plus>+</div><div class=slab>Create story</div></div>`;stories.forEach(s=>{r.innerHTML+=`<div class=s><img src=${s}><div class=slab>You</div></div>`});if(stories.length==0)r.innerHTML+=`<div class=s><img src=https://picsum.photos/200/300?2><div class=slab>VortexX</div></div><div class=s><img src=https://picsum.photos/200/300?3><div class=slab>Brilliant</div></div>`}
function renderFeed(){let f=document.getElementById('feed');f.innerHTML='';let all=posts.length?posts:[{name:'The Peoples Daily',text:'BETWAY QUEEN NEO DONATES P2,000',img:'https://picsum.photos/600/400?5',likes:124}];all.forEach((p,i)=>{f.innerHTML+=`<div class=post><div class=post-h><img src=https://i.pravatar.cc/100?img=${32+i}><div><b>${p.name}</b><br><small style=opacity:.5>Now • 🌍</small></div></div><p style=margin:8px 0>${p.text}</p>${p.img?`<img class=pimg src=${p.img}>`:''}<div class=act><button onclick="this.textContent='❤️ Liked';this.style.color='#00d4ff'">👍 Like ${p.likes||0}</button><button>💬 Comment</button><button>↗️ Share</button></div></div>`});}
function renderFriends(){document.getElementById('friendsList').innerHTML=`<div class=mitem>👤 Neo Queen - 12 mutual <button style="float:right;background:#00d4ff;border:0;padding:6px 12px;border-radius:12px;color:#000;font-weight:700">Confirm</button></div><div class=mitem>👤 Caro Pako - 5 mutual <button style="float:right;background:#00d4ff;border:0;padding:6px 12px;border-radius:12px;color:#000;font-weight:700">Add</button></div>`}
function renderVideo(){document.getElementById('videoFeed').innerHTML=`<div class=post><img class=pimg src=https://picsum.photos/400/700?1 style=height:420px><div class=act><button>❤️ 1.2k</button><button>💬 89</button><button>↗️ Share</button></div></div>`}
function renderMarket(){document.getElementById('marketGrid').innerHTML=`<div style="background:rgba(255,255,255,.06);border-radius:12px;overflow:hidden"><img src=https://picsum.photos/300/200?1 style=width:100%;height:110px;object-fit:cover><div style=padding:8px><b>P8,500 iPhone</b></div></div><div style="background:rgba(255,255,255,.06);border-radius:12px;overflow:hidden"><img src=https://picsum.photos/300/200?2 style=width:100%;height:110px;object-fit:cover><div style=padding:8px><b>P45,000 BMW</b></div></div>`}
function createPost(){let t=prompt("What's on your mind, Brilliant?");if(!t)return;if(confirm('Add YOUR photo?')){document.getElementById('fPost').dataset.text=t;document.getElementById('fPost').click()}else{posts.unshift({name:'Brilliant',text:t,img:'',likes:0});localStorage.setItem('vx_p',JSON.stringify(posts));renderFeed()}}
document.getElementById('fStory').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);stories.unshift(u);localStorage.setItem('vx_s',JSON.stringify(stories));renderStories()});
document.getElementById('fPost').addEventListener('change',e=>{let f=e.target.files[0];let txt=e.target.dataset.text||'';let u=f?URL.createObjectURL(f):'';posts.unshift({name:'Brilliant',text:txt,img:u,likes:0});localStorage.setItem('vx_p',JSON.stringify(posts));renderFeed()});
renderStories();renderFeed();renderFriends();renderVideo();renderMarket();
</script>
</body>
  </html>
