<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050712">
<title>VORTEX — Neon Profile World</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#050712;
  --card:rgba(12,15,35,.78);
  --text:#fff;
  --muted:#a7acc5;
  --neon:#00d9ff;
  --neon2:#3478ff;
  --glow:rgba(0,217,255,.55);
}

html,body{
  margin:0;
  min-height:100%;
  background:#050712;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
  transition:.5s;
}

/* VORTEX BACKGROUND */

body::before,
body::after{
  content:"";
  position:fixed;
  inset:-35%;
  pointer-events:none;
  z-index:-2;
  background:
    radial-gradient(circle at 50% 50%,
      transparent 0 12%,
      var(--glow) 13%,
      transparent 24%,
      rgba(139,77,255,.22) 32%,
      transparent 45%);
  animation:vortex 18s linear infinite;
}

body::after{
  animation-direction:reverse;
  animation-duration:25s;
  opacity:.55;
}

@keyframes vortex{
  from{transform:rotate(0deg) scale(1)}
  to{transform:rotate(360deg) scale(1.15)}
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:14px 16px;
  background:rgba(5,7,18,.72);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.header-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:3px;
  color:#fff;
  text-shadow:
    0 0 8px var(--neon),
    0 0 25px var(--neon);
}

.logo span{
  color:var(--neon);
}

.menu-btn{
  border:0;
  background:rgba(255,255,255,.08);
  color:#fff;
  width:43px;
  height:43px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

/* MAIN */

main{
  width:min(900px,100%);
  margin:auto;
  padding:22px 15px 50px;
}

/* PROFILE */

.profile-card{
  position:relative;
  overflow:hidden;
  padding:28px 20px;
  border-radius:30px;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.10),
    rgba(255,255,255,.025)
  );
  border:1px solid rgba(255,255,255,.12);
  box-shadow:
    0 0 35px var(--glow),
    inset 0 0 30px rgba(255,255,255,.025);
  backdrop-filter:blur(18px);
}

.profile-card::before{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  left:50%;
  top:-130px;
  transform:translateX(-50%);
  border-radius:50%;
  background:var(--glow);
  filter:blur(80px);
  opacity:.45;
}

.profile-content{
  position:relative;
  z-index:2;
  text-align:center;
}

/* NEON PROFILE IMAGE */

.avatar-wrap{
  width:160px;
  height:160px;
  margin:5px auto 18px;
  padding:6px;
  border-radius:50%;
  position:relative;
  background:conic-gradient(
    from 0deg,
    var(--neon),
    var(--neon2),
    #8b4dff,
    var(--neon),
    var(--neon2)
  );
  animation:spinGlow 5s linear infinite;
  box-shadow:
    0 0 15px var(--neon),
    0 0 45px var(--glow),
    0 0 90px var(--glow);
}

.avatar-wrap::before{
  content:"";
  position:absolute;
  inset:-14px;
  border-radius:50%;
  border:2px solid var(--neon);
  opacity:.45;
  filter:blur(1px);
  animation:pulseRing 2s ease-in-out infinite;
}

.avatar-wrap::after{
  content:"";
  position:absolute;
  inset:-28px;
  border-radius:50%;
  border:1px dashed var(--neon);
  opacity:.28;
  animation:spinGlow 12s linear infinite reverse;
}

@keyframes spinGlow{
  to{transform:rotate(360deg)}
}

@keyframes pulseRing{
  50%{
    transform:scale(1.08);
    opacity:.8;
  }
}

.avatar{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
  border:5px solid #080a18;
}

.name{
  font-size:27px;
  font-weight:900;
  margin:10px 0 5px;
}

.bio{
  color:var(--muted);
  margin:0 auto 18px;
  max-width:500px;
}

/* BUTTONS */

.buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);
  color:#fff;
  padding:12px 18px;
  border-radius:16px;
  cursor:pointer;
  font-weight:700;
  transition:.25s;
}

.btn:hover,
.btn:active{
  transform:translateY(-2px);
  box-shadow:0 0 25px var(--glow);
  border-color:var(--neon);
}

.btn.primary{
  background:linear-gradient(
    135deg,
    var(--neon),
    var(--neon2)
  );
  color:#02040b;
  border:0;
}

/* SECTION */

.section{
  margin-top:25px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.section-title span{
  color:var(--muted);
  font-size:13px;
}

/* THEME GRID */

.themes{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.theme{
  position:relative;
  min-height:150px;
  overflow:hidden;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.12);
  padding:15px;
  cursor:pointer;
  transition:.3s;
  background:#111426;
}

.theme:hover,
.theme:active{
  transform:scale(1.025);
}

.theme.selected{
  border:2px solid var(--neon);
  box-shadow:
    0 0 18px var(--glow),
    inset 0 0 25px var(--glow);
}

.theme-preview{
  width:65px;
  height:65px;
  border-radius:50%;
  margin-bottom:12px;
  border:4px solid rgba(255,255,255,.8);
  box-shadow:0 0 25px currentColor;
}

.theme h3{
  margin:0 0 5px;
  font-size:16px;
}

.theme p{
  margin:0;
  color:rgba(255,255,255,.65);
  font-size:12px;
}

/* THEME VISUALS */

  --t:#00d9ff;

.t1 .theme-preview{
  background:radial-gradient(circle,#00d9ff,#3478ff,#050712);
  color:#00d9ff;
}

.t2{
  background:
    radial-gradient(circle at 30% 20%,#d946ef55,transparent 35%),
    #100719;
}
.t2 .theme-preview{
  background:radial-gradient(circle,#ff72ff,#7c3aed,#090313);
  color:#d946ef;
}

.t3{
  background:
    linear-gradient(120deg,#ff008855,#00eaff55,#8b5cf655),
    #090b17;
}
.t3 .theme-preview{
  background:conic-gradient(#ff00c8,#00eaff,#ffe600,#ff00c8);
  color:#00eaff;
}

    linear-gradient(135deg,#ffffff18,#00d9ff18),
