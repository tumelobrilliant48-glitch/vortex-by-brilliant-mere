/* =========================================================
   VORTEX SOCIAL MEDIA

========================================================= */

:root {
    --bg: #02050d;
    --panel: rgba(10, 15, 30, .82);
    --panel2: rgba(15, 20, 40, .9);

    --cyan: #00eaff;
    --blue: #238cff;
    --purple: #8d4dff;
    --pink: #ff4fd8;

    --text: #f5f7ff;
    --muted: #8c96b3;

    --border: rgba(0, 225, 255, .32);
    --shadow:

        0 0 40px rgba(145, 70, 255, .08);

    --radius: 22px;
}

/* RESET */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background:
        radial-gradient(circle at 15% 10%, rgba(0, 210, 255, .08), transparent 25%),

    color: var(--text);
    font-family:

        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    overflow-x: hidden;
}

button,
input,
textarea {
    font: inherit;
}

button {
    border: 0;
    color: inherit;
    background: none;
    cursor: pointer;
}
