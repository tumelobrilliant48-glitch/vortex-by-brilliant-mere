<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>VORTEX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05061a;color:#fff;font-family:Inter,Arial;overflow-x:hidden;perspective:1000px}
.bg{position:fixed;inset:0;z-index:-3;background:#05061a}
.orb{position:fixed;border-radius:50%;filter:blur(40px);animation:float 6s ease-in-out infinite;z-index:-2}
.orb1{width:380px;height:380px;background:radial-gradient(circle,#7c3aed 0%,transparent 70%);top:-100px;left:-80px;animation-delay:0s}
.orb2{width:300px;height:300px;background:radial-gradient(circle,#ec4899 0%,transparent 70%);bottom:10%;right:-60px;animation-delay:2s}
.orb3{width:200px;height:200px;background:radial-gradient(circle,#38bdf8 0%,transparent 70%);top:40%;left:50%;animation-delay:1s}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(20px,-30px,50px) scale(1.1)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(56,189,248,.6),0 0 40px rgba(124,58,237,.4),inset 0 0 20px rgba(56,189,248,.2)}50%{box-shadow:0 0 35px rgba(56,189,248,1),0 0 70px rgba(124,58,237,.7),inset 0 0 30px rgba(56,189,248,.35)}}
@keyframes circleGlow{0%,100%{box-shadow:0 0 15px #c084fc,0 0 30px #c084fc}50%{box-shadow:0 0 25px #ff5ca1,0 0 50px #7c3aed}}
.page{display:none;padding:16px 16px 100px;min-height:100vh}
.page.active{display:block}
.logo{text-align:center;font-size:30px;font-weight:900;background:linear-gradient(90deg,#c084fc,#ff5ca1,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 15px rgba(192,132,252,.8));transform:translateZ(30px)}
.avatar{width:90px;height:90px;border-radius:50%;border:3px solid transparent;background:linear-gradient(#05061a,#05061a) padding-box,linear-gradient(90deg,#c084fc,#38bdf8) border-box;box-shadow:0 0 25px rgba(192,132,252,.8),0 10px 20px rgba(0,0,0,.5);animation:circleGlow 3s infinite;transform:translateZ(20px);display:block;margin:0 auto;object-fit:cover}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:7px 16px;font-size:12px;box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);transform:translateZ(10px);transition:.2s}
.pill:active{transform:translateZ(0) scale(.95)}
.chat{background:rgba(20,20,45,.75);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15);transform-style:preserve-3d;transform:translateZ(10px);transition:.3s}
.chat:hover{transform:translateZ(30px) translateY(-2px);box-shadow:0 20px 40px rgba(124,58,237,.3)}
.chat img{width:48px;height:48px;border-radius:50%;box-shadow:0 0 15px rgba(192,132,252,.6);animation:circleGlow 3s infinite}
.ai-box{position:relative;border-radius:22px;padding:20px;background:rgba(10,20,45,.6);backdrop-filter:blur(20px);border:1.5px solid #38bdf8;animation:glowPulse 2.5s infinite;transform:translateZ(40px);transform-style:preserve-3d;box-shadow:0 15px 40px rgba(0,0,0,.6)}
.ai-box::before{content:'';position:absolute;inset:-2px;border-radius:22px;background:linear-gradient(90deg,#7c3aed,#38bdf8,#ec4899);z-index:-1;filter:blur(12px);opacity:.7}
.btn-3d{background:linear-gradient(180deg,#8b5cf6 0%,#6d28d9 100%);border:0;border-bottom:3px solid #4c1d95;border-radius:22px;padding:13px 20px;color:#fff;font-weight:800;width:100%;box-shadow:0 8px 0 #4c1d95,0 15px 25px rgba(124,58,237,.5),inset 0 1px 0 rgba(255,255,255,.4);transform:translateZ(20px);transition:.1s}
.btn-3d:active{transform:translateZ(5px) translateY(6px);box-shadow:0 2px 0 #4c1d95,0 5px 10px rgba(124,58,237,.5)}
.search{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:14px 18px;color:#fff;outline:0;box-shadow:inset 0 2px 8px rgba(0,0,0,.5),0 4px 15px rgba(0,0,0,.3);transform:translateZ(15px)}
.nav{position:fixed;bottom:12px;left:12px;right:12px;background:rgba(10,10,30,.85);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.12);border-radius:28px;display:flex;justify-content:space-around;padding:10px 0;box-shadow:0 15px 40px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.15);z-index:50;transform:translateZ(50px)}
.nav button{background:0;border:0;color:#fff;opacity:.5;transform:translateZ(10px);transition:.2s}
.nav button.active{opacity:1;color:#c084fc;transform:translateZ(25px) scale(1.2);filter:drop-shadow(0 0 12px #c084fc)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>

<div id="home" class="page active">
<div class="logo">VORTEX</div>
<div style="text-align:center;margin:14px 0"><img class="avatar" src="https://i.pravatar.cc/200?img=32"><div style="margin-top:8px;opacity:.6;font-size:10px;letter-spacing:4px">V O R T E X</div><div style="display:flex;justify-content:center;gap:8px;margin-top:12px"><span class="pill">Delete</span><span class="pill">👤 Like</span><span class="pill">📄 Posts</span></div></div>
<div id="chatList"></div>
</div>

<div id="ai" class="page">
<div class="logo">VORTEX<br>AI</div>
<input class="search" id="aiInput" placeholder="🔍 Connect. Make Discovery" onkeyup="if(event.key==='Enter')askAI()" style="margin-top:12px">
<div class="ai-box" style="margin-top:18px">
<small style="opacity:.7;letter-spacing:2px">Dior</small>
<h2 style="margin:6px 0">Vortex</h2>
<p style="font-size:13px;opacity:.85;line-height:1.5">Search or increase offline output, search other tiny or outside code. A true AI filter asked values helping, you filter or many are Discord for AI</p>
<button class="btn-3d" style="margin-top:16px" onclick="askAI()">Choose a festival</button>
</div>
<div id="aiChat"></div>
</div>

<div id="profile" class="page"><div style="display:flex;gap:10px"><span onclick="go('home')">‹ Back</span><b style="flex:1;text-align:center">VORTEX</b></div><div style="text-align:center;margin-top:20px"><img class="avatar" src="https://i.pravatar.cc/200?img=32" style="width:100px;height:100px"><h2 style="margin-top:10px">Brilliant</h2></div></div>
<div id="explore" class="page"><input class="search" placeholder="🔍 Explore Vortex"><h3 style="margin:16px 0">✨ Explore!</h3><p style="opacity:.6">Trending posts coming...</p></div>

<div class="nav">
<button class="active" id="n0" onclick="go('home')">🏠</button>
<button id="n1" onclick="go('explore')">🔍</button>
<button id="n2" onclick="go('ai')">🤖</button>
<button id="n3" onclick="go('profile')">👤</button>
</div>

<script>
let chats=[{n:'Brilliant',t:'Content is Available',i:32},{n:'VorttexX',t:'Work fast & nice...',i:15},{n:'Druhde Cogb',t:'Trom...',i:20}];
function render(){let c=document.getElementById('chatList');c.innerHTML='';chats.forEach(u=>{c.innerHTML+=`<div class=chat><img src=https://i.pravatar.cc/100?img=${u.i}><div style=flex:1><b>${u.n}</b><br><small style=opacity:.6>${u.t}</small></div><span>›</span></div>`})}
render();
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let m={home:0,explore:1,ai:2,profile:3};document.getElementById('n'+m[id]).classList.add('active')}
function askAI(){let q=document.getElementById('aiInput');let t=q.value||'Hello Vortex';document.getElementById('aiChat').innerHTML+=`<div style="margin-top:12px;background:rgba(255,255,255,.08);padding:12px;border-radius:16px"><b>You:</b> ${t}</div><div style="margin-top:8px" class=ai-box><b>VORTEX AI:</b> ${t} — glowing 3D activated! 🚀✨</div>`;q.value='';}
</script>
</body>
</html>
