<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORTEX - By Brilliant Mere</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">
</head>
<body class="theme-midnight">
<div id="app">
  <header class="app-header"><h1>VORTEX</h1><span>Connect · Create · Discover</span></header>

  <div id="home" class="screen"><div id="home-feed"></div><div id="stories-bar"></div></div>
  <div id="reels" class="screen" style="display:none"><div id="reels-feed"></div></div>
  <div id="find" class="screen" style="display:none">
    <div class="app-card"><input id="q" placeholder="Search people #332, posts #333, reels #336, marketplace #340, groups #341" class="input-neon"></div>
    <div id="searchResults"></div>
  </div>
  <div id="chat" class="screen" style="display:none"><div id="chat-list"></div></div>
  <div id="vault" class="screen" style="display:none"><div id="vault-feed"></div></div>
  <div id="market" class="screen" style="display:none"><div id="market-feed"></div></div>
  <div id="profile" class="screen" style="display:none"><div id="profile-feed"></div></div>
  <div id="settings" class="screen" style="display:none"><div id="settings-feed"></div></div>
</div>

<div class="bottom-nav">
  <div id="nav-home" class="nav-item active" onclick="VORTEX.go('home')">HOME</div>
  <div id="nav-reels" class="nav-item" onclick="VORTEX.go('reels')">REELS</div>
  <div id="nav-find" class="nav-item" onclick="VORTEX.go('find')">FIND</div>
  <div id="nav-market" class="nav-item" onclick="VORTEX.go('market')">MARKET</div>
  <div id="nav-chat" class="nav-item" onclick="VORTEX.go('chat')">CHAT</div>
  <div id="nav-vault" class="nav-item" onclick="VORTEX.go('vault')">VAULT</div>
  <div id="nav-profile" class="nav-item" onclick="VORTEX.go('profile')">YOU</div>
</div>

<script src="core/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
