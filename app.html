<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>VORTEX — Galaxy Terminal</title>

<link rel="stylesheet" href="css/vortex.css">

<style>
:root{
  --cyan:#00d9ff;
  --blue:#3478ff;
  --purple:#8b4dff;
  --pink:#e14cff;
  --white:#ffffff;
  --muted:rgba(255,255,255,.58);
  --glass:rgba(255,255,255,.065);
  --border:rgba(255,255,255,.13);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 15% 15%,rgba(0,217,255,.13),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(139,77,255,.14),transparent 32%),
    radial-gradient(circle at 50% 100%,rgba(225,76,255,.08),transparent 35%),
    #03050d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

body{
  min-height:100vh;
}

/* GALAXY BACKGROUND */

#stars{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

.glow{
  position:fixed;
  width:320px;
  height:320px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.18;
  pointer-events:none;
  z-index:0;
}

.glow-1{
  top:-120px;
  left:-100px;
  background:var(--cyan);
}

.glow-2{
  right:-120px;
  bottom:-100px;
  background:var(--purple);
}

/* MAIN TERMINAL */

.terminal{
  position:relative;
  z-index:2;
  width:min(1100px,100%);
  margin:auto;
  padding:22px 16px 50px;
}

/* TOP BAR */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:12px 16px;
  border:1px solid var(--border);
  border-radius:22px;
  background:rgba(10,14,28,.65);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  box-shadow:
    0 20px 60px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.08);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-orb{
  width:40px;
  height:40px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:19px;
  background:
    radial-gradient(circle at 30% 25%,#fff,transparent 12%),
    linear-gradient(135deg,var(--cyan),var(--blue),var(--purple));
  box-shadow:
    0 0 25px rgba(0,217,255,.35),
    inset 0 0 15px rgba(255,255,255,.25);
}

.brand-text strong{
  display:block;
  font-size:15px;
  letter-spacing:4px;
}

.brand-text span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
  letter-spacing:2px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:#bdefff;
  font-size:10px;
  letter-spacing:1px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#48ffb0;
  box-shadow:0 0 12px #48ffb0;
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  margin-top:18px;
  padding:35px 24px 30px;
  min-height:285px;
  border:1px solid var(--border);
  border-radius:30px;
  background:
    linear-gradient(
      135deg,
      rgba(0,217,255,.09),
      rgba(139,77,255,.08),
      rgba(255,255,255,.035)
    );
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  box-shadow:
    0 30px 90px rgba(0,0,0,.4),
    inset 0 1px rgba(255,255,255,.1);
}

.hero:before{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  right:-130px;
  top:-180px;
  border-radius:50%;
  border:1px solid rgba(0,217,255,.2);
  box-shadow:
    0 0 80px rgba(0,217,255,.12);
}

.hero:after{
  content:"";
  position:absolute;
  width:500px;
  height:1px;
  right:-100px;
  bottom:45px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(0,217,255,.35),
    transparent
  );
  transform:rotate(-18deg);
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:650px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  border:1px solid rgba(0,217,255,.2);
  border-radius:999px;
  background:rgba(0,217,255,.06);
  color:#9ceeff;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.hero h1{
  margin:19px 0 8px;
  font-size:clamp(42px,9vw,78px);
  line-height:.95;
  letter-spacing:10px;
  font-weight:800;
  background:linear-gradient(
    100deg,
    #fff,
    #9eeeff 35%,
    #8e7cff 75%,
    #fff
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 40px rgba(0,217,255,.12);
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px;
}

.enter-btn{
  border:1px solid rgba(0,217,255,.4);
  border-radius:14px;
  padding:12px 18px;
  color:#fff;
  background:linear-gradient(
    135deg,
    rgba(0,217,255,.2),
    rgba(91,73,255,.22)
  );
  box-shadow:
    0 0 25px rgba(0,217,255,.1),
    inset 0 1px rgba(255,255,255,.12);
  font-weight:700;
  font-size:11px;
  letter-spacing:1px;
}

.mini-btn{
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 16px;
  color:rgba(255,255,255,.72);
  background:rgba(255,255,255,.04);
  font-size:11px;
}

/* FLIGHT BOARD */

.flight-board{
  margin-top:18px;
  padding:18px;
  border:1px solid var(--border);
  border-radius:24px;
  background:rgba(255,255,255,.045);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

.board-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.board-title{
  font-size:10px;
  letter-spacing:2px;
  color:rgba(255,255,255,.55);
  text-transform:uppercase;
}

.board-time{
  font-size:10px;
  color:#8eeeff;
}

.flight-row{
  display:grid;
  grid-template-columns:1fr auto 1fr auto;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-top:1px solid rgba(255,255,255,.07);
}

.flight-row:first-of-type{
  border-top:0;
}

.city strong{
  display:block;
  font-size:15px;
  letter-spacing:2px;
}

.city span{
  color:var(--muted);
  font-size:9px;
}

.route{
  color:#8eeeff;
  font-size:15px;
}

.gate{
  padding:6px 9px;
  border-radius:9px;
  background:rgba(0,217,255,.08);
  color:#9eeeff;
  font-size:9px;
  white
